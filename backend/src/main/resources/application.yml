server:
  port: 8081

spring:
  application:
    name: secure-vault-backend

  # Striktna deserijalizacija: odbij nepoznata polja u telima zahteva (DEVELOPMENT_PLAN 5.2).
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # Faza 1: Data Layer. Vrednosti iz env-a (Docker), sa lokalnim default-ima za `mvn spring-boot:run`.
  # U Docker mreži host je `postgres` (vidi .env / docker-compose); lokalno je `localhost`.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/securevault}
    username: ${POSTGRES_USER:vault}
    password: ${POSTGRES_PASSWORD:vault}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway je vlasnik šeme; Hibernate samo VALIDIRA da se entiteti poklapaju sa tabelama.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  # Flyway radi auto-migrate na startu (pre nego što Hibernate validira i pre prvog zahteva).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Faza 4 — Autentikacija. TTL-ovi (access/refresh/session) NISU ovde: oni dolaze iz aktivne
# security_policy (admin ih menja u Fazi 8). Ovde su samo tajne i ne-politički parametri.
app:
  auth:
    # HS256 tajna za potpis JWT-a. MORA biti >= 32 bajta. Dev default je nesiguran — u
    # produkciji se postavlja preko JWT_SECRET (npr. `openssl rand -base64 48`).
    jwt-secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789abcdef}
    jwt-issuer: secure-vault
    # Server-side ključ kojim se TOTP tajne šifruju u bazi (izvan zero-knowledge domena).
    # Bilo koji string — interno se SHA-256 hešom svodi na 32B AES ključ.
    server-kms-key: ${SERVER_KMS_KEY:dev-only-insecure-server-kms-key-change-me}
    # Trajanje privremenog MFA tiketa između login koraka (sekunde).
    mfa-ticket-ttl-sec: 300
    # Secure flag na sesijskim kolačićima. Dev je http://localhost (false); u
    # produkciji/dockeru se pali preko APP_COOKIE_SECURE=true.
    cookie-secure: ${APP_COOKIE_SECURE:false}

  # Faza 5 — OIDC prijava. Podrazumevano isključeno (/auth/oidc/** vraća 404) dok se ne
  # konfiguriše eksterni provajder. OIDC daje SAMO sesiju — master lozinka je i dalje
  # obavezna za otključavanje vault-a (zero-knowledge očuvan).
  oidc:
    enabled: ${OIDC_ENABLED:false}
    issuer: ${OIDC_ISSUER:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    authorization-uri: ${OIDC_AUTHORIZATION_URI:}
    token-uri: ${OIDC_TOKEN_URI:}
    jwks-uri: ${OIDC_JWKS_URI:}
    # Provajder vraća browser ovde (kroz gateway). Mora biti registrovan kod provajdera.
    redirect-uri: ${OIDC_REDIRECT_URI:http://localhost:8080/api/auth/oidc/callback}
    scopes: ${OIDC_SCOPES:openid email profile}
    # Frontend stranice na koje se browser vraća posle OIDC toka.
    post-login-redirect-uri: ${OIDC_POST_LOGIN_REDIRECT_URI:http://localhost:5173/login?oidc=success}
    post-login-error-uri: ${OIDC_POST_LOGIN_ERROR_URI:http://localhost:5173/login?oidc=error}
    state-ttl-sec: ${OIDC_STATE_TTL_SEC:300}
